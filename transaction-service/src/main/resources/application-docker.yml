  spring:
    config:
      activate:
        on-profile: docker

    datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-tx:5432/tx_db}
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:maria}
      driver-class-name: org.postgresql.Driver

      hikari:
        initialization-fail-timeout: 60000

    jpa:
      hibernate:
        ddl-auto: update

      show-sql: false

      database-platform: org.hibernate.dialect.PostgreSQLDialect

    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

      consumer:
        group-id: transaction-service-group
        auto-offset-reset: earliest


  server:
    port: 8002


  external:
    brasilapi:
      url: ${BRASILAPI_URL:https://brasilapi.com.br/api}

    mockbank:
      url: ${MOCKBANK_URL:http://mockbank:8080}


  jwt:
    secret: ${JWT_SECRET:dev-secret-super-long-for-hs256-algo-1234567890}

    expiration: ${JWT_EXPIRATION:3600000}


  logging:
    level:
      org.springframework: INFO
      org.apache.kafka: WARN
